<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VKrypt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 data-i18n="extensionName">VKrypt</h1>
      <div id="status" class="status status-inactive">
        <span data-i18n="statusInactive">⚠️ Ключи не настроены</span>
      </div>
    </header>

    <main>
      <!-- Keys Section -->
      <section id="keys-section" class="section">
        <div id="no-keys" class="key-status">
          <p data-i18n="keysNotGenerated">❌ Ключи не сгенерированы</p>
          <button id="generate-btn" class="btn btn-primary" data-i18n="generateKeys">Сгенерировать ключи</button>
        </div>
        
        <div id="has-keys" class="key-status hidden">
          <p data-i18n="keysReady">✅ Ключи готовы</p>
          
          <div class="key-display">
            <label data-i18n="yourPublicKey">Ваш публичный ключ:</label>
            <textarea id="public-key-display" readonly></textarea>
            <div class="button-group">
              <button id="copy-public-key-btn" class="btn btn-small" data-i18n="copyToClipboard">Копировать</button>
            </div>
          </div>
          
          <div class="contact-key-section">
            <h3 data-i18n="importContactKey">Импорт ключа контакта</h3>
            <input type="text" id="contact-name" data-i18n-placeholder="enterContactName" placeholder="Введите имя контакта">
            <textarea id="contact-public-key" data-i18n-placeholder="enterPublicKey" placeholder="Вставьте публичный ключ контакта"></textarea>
            <div class="button-group">
              <button id="paste-contact-key-btn" class="btn btn-small" data-i18n="pasteFromClipboard">Вставить</button>
              <button id="save-contact-key-btn" class="btn btn-primary" data-i18n="save">Сохранить</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Settings Section -->
      <section id="settings-section" class="section">
        <h3 data-i18n="settings">Настройки</h3>
        <div class="setting-row">
          <label data-i18n="language">Язык:</label>
          <select id="language-select">
            <option value="auto" data-i18n="autoLanguage">Авто (как в VK)</option>
            <option value="ru" data-i18n="russian">Русский</option>
            <option value="en" data-i18n="english">English</option>
          </select>
        </div>
      </section>

      <!-- Chat Info Section -->
      <section id="chat-info-section" class="section">
        <div id="no-chat" class="chat-status">
          <p data-i18n="noChatDetected">Чат не обнаружен</p>
        </div>
        <div id="has-chat" class="chat-status hidden">
          <p data-i18n="chatDetected">✅ Чат обнаружен</p>
          <p id="chat-type" class="chat-type"></p>
        </div>
      </section>
    </main>

    <footer>
      <p class="version">VKrypt v1.0.0</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
