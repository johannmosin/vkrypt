<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VKrypt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🔐 VKrypt</h1>
      <p class="subtitle" data-i18n="extensionDescription">Сквозное шифрование для ВКонтакте</p>
    </header>

    <div id="status-section" class="section">
      <div id="status-indicator" class="status-indicator">
        <span class="status-icon">⚠️</span>
        <span class="status-text" data-i18n="statusInactive">Нужны ключи</span>
      </div>
    </div>

    <div id="key-generation-section" class="section">
      <button id="generate-keys-btn" class="btn btn-primary" data-i18n="generateKeys">
        Сгенерировать ключи
      </button>
    </div>

    <div id="keys-section" class="section" style="display: none;">
      <div class="key-info">
        <h3 data-i18n="yourPublicKey">Ваш открытый ключ:</h3>
        <div class="key-display">
          <textarea id="public-key-textarea" readonly></textarea>
          <div class="key-actions">
            <button id="copy-public-key-btn" class="btn btn-small" data-i18n="copyToClipboard">Копировать</button>
          </div>
        </div>
      </div>

      <div class="contact-key-section">
        <h3 data-i18n="importContactKey">Импорт ключа контакта:</h3>
        <div class="form-group">
          <label data-i18n="contactName">Имя контакта:</label>
          <input type="text" id="contact-name-input" placeholder="Имя или ID">
        </div>
        <div class="form-group">
          <label data-i18n="contactPublicKey">Открытый ключ контакта:</label>
          <textarea id="contact-key-textarea" placeholder="Вставьте открытый ключ контакта"></textarea>
          <button id="paste-contact-key-btn" class="btn btn-small btn-secondary" data-i18n="pasteFromClipboard">Вставить</button>
        </div>
        <button id="save-contact-key-btn" class="btn btn-primary" data-i18n="save">Сохранить</button>
      </div>

      <div id="saved-keys-section" class="saved-keys">
        <h3 data-i18n="groupParticipants">Участники:</h3>
        <ul id="saved-keys-list"></ul>
      </div>
    </div>

    <div id="settings-section" class="section">
      <h3 data-i18n="settings">Настройки</h3>
      <div class="form-group">
        <label data-i18n="language">Язык:</label>
        <select id="language-select">
          <option value="auto" data-i18n="autoLanguage">Авто (как VK)</option>
          <option value="ru" data-i18n="russian">Русский</option>
          <option value="en" data-i18n="english">English</option>
        </select>
      </div>
    </div>

    <div id="current-chat-section" class="section">
      <h3 data-i18n="chatDetected">Чат:</h3>
      <div id="current-chat-info" class="chat-info">
        <span data-i18n="noChatDetected">Чат не обнаружен</span>
      </div>
    </div>

    <footer class="footer">
      <p>VKrypt v1.0 • E2EE для ВКонтакте</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
